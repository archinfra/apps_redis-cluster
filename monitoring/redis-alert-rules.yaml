apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-cluster-alerts
  labels:
    app.kubernetes.io/name: redis-cluster
spec:
  groups:
    - name: redis-cluster.rules
      rules:
        - alert: RedisExporterDown
          expr: redis_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Redis instance unavailable

        - alert: RedisClusterMemoryHigh
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Redis memory usage is above 85%

        - alert: RedisRejectedConnections
          expr: increase(redis_rejected_connections_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Redis is rejecting client connections
