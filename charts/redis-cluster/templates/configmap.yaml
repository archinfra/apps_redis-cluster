apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-default
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    archinfra.io/redis-config-baseline: "8.10.1"
    archinfra.io/redis-config-source: "runtime-image"
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
    {{- end }}
data:
{{- if .Values.redis.defaultConfigOverride }}
  # A user supplied full configuration remains authoritative for backwards
  # compatibility with the upstream chart contract.
  redis-default.conf: |-
    {{- include "common.tplvalues.render" (dict "value" .Values.redis.defaultConfigOverride "context" $) | nindent 4 }}
{{- else }}
  # Do not vendor a full redis.conf in the chart. The runtime image embeds the
  # exact redis.conf from the same pinned Redis source commit as redis-server.
  # This small file is the archinfra overlay plus the mutable keys required by
  # the compatibility scripts.
  redis-default.conf: |-
    include /opt/bitnami/redis/etc.default/redis.conf

    # Network/authentication keys mutated by libredis.sh
    bind 127.0.0.1 -::1
    protected-mode yes
    port 6379
    tcp-keepalive {{ default 300 .Values.redis.runtimeConfig.tcpKeepalive }}
    # requirepass archinfra-placeholder
    # masterauth archinfra-placeholder
    # aclfile /opt/bitnami/redis/etc/users.acl

    # Capacity guardrails. Keep maxmemory below the pod cgroup limit so Redis
    # has headroom for allocator overhead, replication/client buffers and fork COW.
    maxmemory {{ default "1536mb" .Values.redis.runtimeConfig.maxmemory }}
    maxmemory-policy {{ default "noeviction" .Values.redis.runtimeConfig.maxmemoryPolicy }}
    maxclients {{ default 10000 .Values.redis.runtimeConfig.maxclients }}

    # Runtime paths and persistence keys mutated by postunpack/setup.
    daemonize no
    pidfile /opt/bitnami/redis/tmp/redis.pid
    logfile ""
    dir /bitnami/redis/data
    appendonly no
    appendfsync {{ default "everysec" .Values.redis.runtimeConfig.appendfsync }}
    auto-aof-rewrite-percentage {{ default 100 .Values.redis.runtimeConfig.autoAofRewritePercentage }}
    auto-aof-rewrite-min-size {{ default "64mb" .Values.redis.runtimeConfig.autoAofRewriteMinSize }}

    # Replication and observability defaults.
    repl-backlog-size {{ default "64mb" .Values.redis.runtimeConfig.replBacklogSize }}
    slowlog-log-slower-than {{ default 10000 .Values.redis.runtimeConfig.slowlogLogSlowerThan }}
    slowlog-max-len {{ default 256 .Values.redis.runtimeConfig.slowlogMaxLen }}

    # TLS keys are intentionally present as commented placeholders so
    # redis_conf_set can safely activate them without carrying a second full
    # Redis configuration snapshot in this chart.
    # tls-port 6379
    # tls-cert-file /opt/bitnami/redis/certs/redis.crt
    # tls-key-file /opt/bitnami/redis/certs/redis.key
    # tls-key-file-pass archinfra-placeholder
    # tls-ca-cert-file /opt/bitnami/redis/certs/redis-ca.crt
    # tls-ca-cert-dir /opt/bitnami/redis/certs
    # tls-dh-params-file /opt/bitnami/redis/certs/redis.dh
    # tls-auth-clients yes
    # tls-cluster yes
    # tls-replication yes

    # Optional Redis I/O threading settings.
    # io-threads-do-reads no
    # io-threads 1

    # Redis Cluster settings mutated by librediscluster.sh.
    cluster-enabled yes
    cluster-config-file /bitnami/redis/data/nodes.conf
    cluster-node-timeout {{ default 15000 .Values.redis.runtimeConfig.clusterNodeTimeout }}
    # cluster-announce-ip 127.0.0.1
    # cluster-announce-hostname localhost
    # cluster-announce-port 6379
    # cluster-announce-bus-port 16379
    # cluster-preferred-endpoint-type ip
{{- end }}
