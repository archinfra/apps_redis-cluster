name: Build Redis Cluster Offline Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-offline-installer.yml"
      - "build.sh"
      - "install.sh"
      - "README.md"
      - "VERSION"
      - "UPSTREAM.yaml"
      - "LICENSES/**"
      - "images/**"
      - "runtime/**"
      - "scripts/**"
      - "charts/**"
  pull_request:
    paths:
      - ".github/workflows/build-offline-installer.yml"
      - "build.sh"
      - "install.sh"
      - "README.md"
      - "VERSION"
      - "UPSTREAM.yaml"
      - "LICENSES/**"
      - "images/**"
      - "runtime/**"
      - "scripts/**"
      - "charts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: |
          case "${{ matrix.arch }}" in
            amd64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "aarch64" ;;
          esac

      - name: Ensure executable permissions
        run: chmod +x build.sh install.sh runtime/redis-cluster/wait-for-port

      - name: Validate fork metadata
        run: python3 scripts/validate-upstream-contract.py

      - name: Build installer
        run: ./build.sh --arch "${{ matrix.arch }}"

      - name: Validate Redis runtime contract
        run: |
          image="archinfra-payload/redis-cluster:8.10.1-r1-${{ matrix.arch }}"
          docker run --rm --entrypoint /bin/bash "$image" -ec '
            test "$(id -u)" = "1001"
            test "$HOME" = "/"
            test "$OS_FLAVOUR" = "debian-12"
            test "$OS_NAME" = "linux"
            test -x /opt/bitnami/scripts/redis-cluster/entrypoint.sh
            test -x /opt/bitnami/scripts/redis-cluster/run.sh
            test -x /usr/local/bin/wait-for-port
            /opt/bitnami/redis/bin/redis-server --version | grep -F "v=8.10.1"
            /opt/bitnami/redis/bin/redis-cli --version | grep -F "8.10.1"
            ! ldd /opt/bitnami/redis/bin/redis-server | grep -F "not found"
            ! ldd /opt/bitnami/redis/bin/redis-cli | grep -F "not found"
            password_file="$(mktemp)"
            printf "%s" "file-secret-contract" > "$password_file"
            export REDIS_PASSWORD_FILE="$password_file"
            . /opt/bitnami/scripts/redis-cluster-env.sh
            test "$REDIS_PASSWORD" = "file-secret-contract"
            rm -f "$password_file"
          '

      - name: Verify installer checksum
        run: |
          cd dist
          sha256sum -c <(printf "%s  %s\n" "$(cat redis-cluster-installer-${{ matrix.arch }}.run.sha256)" "redis-cluster-installer-${{ matrix.arch }}.run")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redis-cluster-installer-${{ matrix.arch }}
          path: |
            dist/redis-cluster-installer-${{ matrix.arch }}.run
            dist/redis-cluster-installer-${{ matrix.arch }}.run.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
